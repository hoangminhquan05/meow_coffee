# Cloudflare Worker – API bán online Meow Coffee (docs/ke-hoach-ban-online.md mục 9)
name = "meow-coffee-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
# Địa chỉ public: https://meow-coffee-api.meowcoffee-dacn2.workers.dev
workers_dev = true
preview_urls = false

# Firestore của project ở Mỹ (nam5): mỗi request gọi Firestore nhiều lượt liên
# tiếp, nên để Cloudflare tự đặt Worker gần Google thay vì gần người dùng.
[placement]
mode = "smart"

# Mỗi phút: hủy đơn VietQR quá hạn; tự kết thúc ca shipper mất GPS;
# lời mời giao đơn quá 60s → mời người tiếp; đơn chưa có shipper → mời lại.
[triggers]
crons = ["* * * * *"]

[vars]
FIREBASE_PROJECT_ID = "meowcoffee-cb07b"

# Bí mật (KHÔNG ghi vào file này) – nạp bằng:
#   npx wrangler secret put FIREBASE_SERVICE_ACCOUNT
#   npx wrangler secret put SEPAY_API_KEY   (khóa API Key đặt trong webhook SePay)
# Chạy local: tạo file worker/.dev.vars (đã gitignore) với dòng
#   FIREBASE_SERVICE_ACCOUNT={...nội dung JSON trên một dòng...}
